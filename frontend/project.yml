name: Swappy
options:
  bundleIdPrefix: de.swappy
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Swappy:
    type: application
    platform: iOS
    sources: [Swappy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.swappy.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Swappy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Swappy/Resources/Info.plist
      properties:
        CFBundleDisplayName: Swappy
        UILaunchScreen: {}
        # Dev only: plain HTTP to localhost / LAN IPs of the dev backend.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Swappy verbindet sich im Entwicklermodus mit dem lokalen Backend.
  SwappyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SwappyTests]
    dependencies:
      - target: Swappy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SwappyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SwappyUITests]
    dependencies:
      - target: Swappy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Swappy
schemes:
  Swappy:
    build:
      targets:
        Swappy: all
        SwappyTests: [test]
        SwappyUITests: [test]
    test:
      targets: [SwappyTests, SwappyUITests]
