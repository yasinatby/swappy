services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: swappy-backend
    container_name: swappy-backend
    ports:
      - "${SWAPPY_PORT:-8080}:8080"
    environment:
      SWAPPY_HOST: 0.0.0.0
      SWAPPY_PORT: 8080
      SWAPPY_DB_PATH: /app/data/swappy.db
      SWAPPY_UPLOAD_DIR: /app/data/uploads
      SWAPPY_JWT_SECRET: ${SWAPPY_JWT_SECRET:-swappy-super-secure-production-secret-key-32chars}
    volumes:
      - swappy_data:/app/data
    restart: unless-stopped

volumes:
  swappy_data: